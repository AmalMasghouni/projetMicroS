spring.cloud.config.uri=http://localhost:8888
spring.application.name=order-service
server.port=8082

# Eureka client
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Configuration base de données (MySQL par exemple)


# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Désactiver Ribbon si tu ne l?utilises pas
spring.cloud.loadbalancer.ribbon.enabled=false

# OAuth2 resource server (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloack:8180/auth/realms/microservices-realm

# Actuator endpoints (si tu en as besoin)
management.endpoints.web.exposure.include=*