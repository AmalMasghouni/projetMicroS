# Spring Cloud Config Server (à activer uniquement si tu utilises vraiment Config Server)
spring.cloud.config.uri=http://localhost:8888

# Application info
spring.application.name=order-service
server.port=8082

# Eureka client configuration
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Datasource MySQL (à adapter selon ta base de données)
spring.datasource.url=jdbc:mysql://mysql-db:3306/order_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# RabbitMQ config - adapte host selon environnement (docker-compose vs local)
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Disable Ribbon (recommandé car déprécié)
spring.cloud.loadbalancer.ribbon.enabled=false

# Security - OAuth2 via Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/microservices-realm

# Actuator endpoints (pour monitoring/debug)
management.endpoints.web.exposure.include=*

