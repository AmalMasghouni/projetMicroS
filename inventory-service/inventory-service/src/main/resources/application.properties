spring.application.name=inventory-service

server.port=8183

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Datasource MySQL (local)
spring.datasource.url=jdbc:mysql://localhost:3306/inventory-db
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# RabbitMQ (local)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Security - OAuth2 via Keycloak (local)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/Authentication

# Disable Vault
spring.cloud.vault.enabled=false

# Actuator endpoints
management.endpoints.web.exposure.include=*
